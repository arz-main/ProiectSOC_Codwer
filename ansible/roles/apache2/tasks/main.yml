- name: Install Apache and PHP
  apt:
    name:
      - apache2
      - php
      - php-mysqli
      - libapache2-mod-php
    state: present
    update_cache: true

- name: Configure PHP database environment variables
  lineinfile:
    path: /etc/apache2/envvars
    line: "{{ item }}"
    state: present
  loop:
    - 'export DB_HOST="{{ db_host }}"'
    - 'export DB_USERNAME="{{ db_username }}"'
    - 'export DB_PASSWORD="{{ db_password }}"'
    - 'export DB_NAME="{{ db_name }}"'
