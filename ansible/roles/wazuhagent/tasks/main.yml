- name: Install Wazuh agent
  apt:
    name: wazuh-agent=4.9.0-1
    state: present
  environment:
    WAZUH_MANAGER: "{{ wazuh_manager }}"

- name: Configure Wazuh Apache access log monitoring
  blockinfile:
    path: /var/ossec/etc/ossec.conf
    marker: "<!-- {mark} APACHE LOGS -->"
    insertbefore: "</ossec_config>"
    block: |
      <localfile>
        <log_format>apache</log_format>
        <location>/var/log/apache2/access.log</location>
      </localfile>
      <localfile>
        <log_format>apache</log_format>
        <location>/var/log/apache2/error.log</location>
      </localfile>

- name: Configure Wazuh manager
  replace:
    path: /var/ossec/etc/ossec.conf
    regexp: 'MANAGER_IP'
    replace: "{{ wazuh_manager }}"

- name: Disable automatic agent enrollment
  ansible.builtin.blockinfile:
    path: /var/ossec/etc/ossec.conf
    marker: "<!-- {mark} ENROLLMENT SETTINGS -->"
    insertbefore: "</client>"
    block: |
      <enrollment>
        <enabled>no</enabled>
      </enrollment>

- name: Register agent with Wazuh manager using password
  ansible.builtin.command: >
    /var/ossec/bin/agent-auth -m {{ wazuh_manager }} -p 1515 -P '{{ wazuh_authd_password }}'
  args:
    creates: /var/ossec/etc/client.keys

- name: Restart Wazuh agent service
  ansible.builtin.systemd:
    name: wazuh-agent
    state: restarted
    enabled: true
