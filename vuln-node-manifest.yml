apiVersion: apps/v1
kind: Deployment
metadata: {name: vuln-node, namespace: wazuh}
spec:
  replicas: 1
  selector: {matchLabels: {app: vuln-node}}
  template:
    metadata: {labels: {app: vuln-node}}
    spec:
      containers:
      - name: node
        image: vuln-node:latest
        imagePullPolicy: Never
        ports: [{containerPort: 22}, {containerPort: 80}]
        securityContext:
          privileged: true

---
apiVersion: v1
kind: Service
metadata: {name: vuln-node, namespace: wazuh}
spec:
  type: NodePort
  selector: {app: vuln-node}
  ports:
  - {name: ssh, port: 22, nodePort: 30022}
  - {name: http, port: 80, nodePort: 30080}
